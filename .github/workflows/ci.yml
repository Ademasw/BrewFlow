# BF-S1-01: lint, test, build and secret scan on every pull request. A breaking PR fails CI.
# Locally the same commands pass (see docs/EVIDENCE.md).
name: ci

on:
  pull_request:
  push:
    branches: [main]

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_PASSWORD: ci-only
          POSTGRES_DB: brewflow_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: Unit and integration tests on real PostgreSQL 18
        working-directory: backend
        env:
          BREWFLOW_TEST_DB_URL: jdbc:postgresql://127.0.0.1:5432/brewflow_test
          BREWFLOW_DB_USER: postgres
          BREWFLOW_DB_PASSWORD: ci-only
        run: ./mvnw -B verify

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run lint
      # route types (LayoutProps) are generated, not committed
      - run: npx next typegen
      - run: npx tsc --noEmit
      - run: npm run build

  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
