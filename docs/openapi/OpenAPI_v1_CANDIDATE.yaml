          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
  /api/v1/auth/logout:
    post:
      tags:
      - Auth
      summary: "Sign out: the session and its KDS streams end"
      operationId: logout
      responses:
        "204":
          description: No Content
        "4XX":
          description: "Error envelope (section 7): 401, 403, 404, 409, 422, 429"
