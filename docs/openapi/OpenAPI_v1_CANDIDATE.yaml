openapi: 3.1.0
info:
  title: BrewFlow API
  description: |
    BrewFlow pilot API (CANDIDATE, not owner-approved). Same-origin JSON under `/api/v1`, server-side session
    cookie `BFSESSION`, CSRF header on every mutation.

    **Try it out in this page**
    1. `GET /api/v1/auth/csrf` → copy `token`, press **Authorize** and paste it into `csrf` (header `X-CSRF-TOKEN`).
    2. `POST /api/v1/auth/login` → the session rotates and the response carries a new `csrf.token`:
       paste it into **Authorize → csrf** again. The browser keeps the session cookie by itself.
    3. While `mustChangeCredential` is true, every route except csrf, me, credential and logout returns
       `403 CREDENTIAL_CHANGE_REQUIRED`.

    `POST /api/v1/orders` needs header `Idempotency-Key` (UUID). Money is a string with two decimals.
    Errors use one envelope: `{"error":{"code","message","requestId","details"}}`.
  version: 0.3.2-draft
servers:
- url: http://127.0.0.1:8080
  description: Generated server url
security:
- session: []
  csrf: []
tags:
- name: Kitchen (KDS)
  description: "Open tickets, prep transitions and the SSE hint stream"
- name: Menu
  description: Catalog for the POS and admin menu management (ADR-011)
- name: Auth
  description: "Session, CSRF and own credential"
- name: "Admin: quote recovery"
  description: Orphan-receipt recovery (section 4.4)
- name: "Admin: shifts and reports"
  description: Shifts and the section 5 internal report
- name: "Admin: staff"
  description: Staff accounts (section 2.1)
- name: "Admin: voids"
  description: Full-order VOID_NOTE corrections (section 4.6)
- name: "Admin: orders"
  description: Orders of one business date for the admin screens
- name: "Admin: audit"
  description: "Append-only, redacted audit trail"
- name: Orders
  description: "Quotes, idempotent submit and order reads (section 4)"
paths:
  /api/v1/admin/menu/items/{id}/modifier-groups:
    put:
      tags:
      - Menu
      summary: Replace the item's modifier groups; 409 MENU_CHANGED
      operationId: replaceItemGroups
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ItemGroupsRequest"
        required: true
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Catalog"
        "4XX":
          description: "Error envelope (section 7): 401, 403, 404, 409, 422, 429"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "5XX":
          description: "Error envelope: 500 INTERNAL_ERROR, 503 TEMPORARILY_UNAVAILABLE"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
  /api/v1/orders:
    post:
      tags:
      - Orders
      summary: Record an order from a quote (Idempotency-Key required)
      operationId: submit
      parameters:
      - name: Idempotency-Key
        in: header
        description: "UUID kept by the POS across timeout, refresh and retry"
        required: true
        schema:
          type: string
        example: 3f1c2a9e-5b7d-4e21-9c0a-8d6f4b2e1a37
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SubmitBody"
        required: true
      responses:
        "201":
          description: Order created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Order"
        "200":
          description: "Same key and same body: the original order"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Order"
        "4XX":
          description: "Error envelope (section 7): 401, 403, 404, 409, 422, 429"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "5XX":
          description: "Error envelope: 500 INTERNAL_ERROR, 503 TEMPORARILY_UNAVAILABLE"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
  /api/v1/orders/quotes:
    post:
      tags:
      - Orders
      summary: "Price a cart on the server: 201 quote with quoteRef, valid 10 minutes"
      operationId: quote
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/QuoteRequest"
        required: true
      responses:
        "201":
          description: Created
          content:
            application/json:
